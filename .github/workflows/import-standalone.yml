# Bootstrap workflow: replaced by the imported standalone CI after completion.
name: Import standalone Vault Plugin Factory

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-standalone.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Checkout validated standalone source
        uses: actions/checkout@v4
        with:
          repository: Byeongwook-Heo/vault-security-portal
          ref: export/vault-plugin-factory-20260909
          path: _source
          persist-credentials: false

      - name: Replace target tree with standalone source
        run: |
          rsync -a --delete --exclude='.git/' --exclude='_source/' _source/ ./
          rm -rf _source

      - name: Commit imported standalone tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: import standalone Vault Plugin Factory"
          git push origin HEAD:main
